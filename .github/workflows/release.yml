name: Release

# Runs when a PR is merged to main (a push to main).
# 1. Finds the merged PR and reads its bump label (bump:major > bump:minor > bump:patch, default patch).
#    A PR labeled no-release is merged without bumping or publishing anything.
# 2. Bumps the version in package.json and pushes the commit to main
# 3. Builds, publishes to npm, then tags and creates a GitHub release
#
# Recovery: run this workflow manually (workflow_dispatch) on main to publish the
# current package.json version without bumping. Publish and release steps are
# skipped if the version is already on npm / the release already exists.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip the bot's own version bump commit
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    permissions:
      contents: write # push the version commit, create tag + release
      pull-requests: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - name: Find merged PR and bump type
        id: pr
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual run - publishing current package.json version without bumping."
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "bump=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PR_JSON=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0]')
          if [ -z "$PR_JSON" ] || [ "$PR_JSON" = "null" ]; then
            echo "No PR associated with $SHA (direct push) - skipping release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LABELS=$(echo "$PR_JSON" | jq -r '.labels[].name')
          if echo "$LABELS" | grep -qx 'no-release'; then
            echo "PR is labeled no-release - skipping release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$LABELS" | grep -qx 'bump:major'; then BUMP=major
          elif echo "$LABELS" | grep -qx 'bump:minor'; then BUMP=minor
          else BUMP=patch
          fi
          echo "PR #$(echo "$PR_JSON" | jq -r .number) -> $BUMP"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}

      - uses: actions/checkout@v4
        if: steps.pr.outputs.release == 'true'
        with:
          # Deploy key (write access, in the main ruleset bypass list) so the version bump can be pushed to protected main
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - uses: actions/setup-node@v4
        if: steps.pr.outputs.release == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        if: steps.pr.outputs.release == 'true'
        run: npm install -g npm@latest

      - name: Enable Corepack (Yarn 4)
        if: steps.pr.outputs.release == 'true'
        run: corepack enable

      - name: Install dependencies
        if: steps.pr.outputs.release == 'true'
        run: yarn install --immutable

      - name: Bump version and push to main
        id: bump
        if: steps.pr.outputs.release == 'true'
        run: |
          if [ "$BUMP" != "none" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            npm version "$BUMP" --no-git-tag-version
            VERSION=$(node -p "require('./package.json').version")
            git commit -am "chore(release): v$VERSION"
            git push origin HEAD:main
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          BUMP: ${{ steps.pr.outputs.bump }}

      - name: Build
        if: steps.pr.outputs.release == 'true'
        run: yarn build

      - name: Publish to npm
        if: steps.pr.outputs.release == 'true'
        run: |
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm - skipping publish."
          else
            npm publish --access public # authenticated via OIDC trusted publishing; provenance is automatic
          fi
        env:
          VERSION: ${{ steps.bump.outputs.version }}

      - name: Tag and create GitHub release
        if: steps.pr.outputs.release == 'true'
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists - skipping."
          else
            gh release create "v$VERSION" --target "$(git rev-parse HEAD)" --generate-notes
          fi
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
