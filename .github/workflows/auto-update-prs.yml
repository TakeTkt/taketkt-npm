name: Auto-update pull requests

# Keeps open PRs up to date with main whenever main changes
# (e.g. after the release bot's version bump commit).

on:
  push:
    branches: [main]

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: allonsy-studio/actions-pr-auto-update@v3
        with:
          token: ${{ github.token }}
          limit: 100
          include_drafts: false
